[tool.poetry]
name = "Coursework_1"
version = "0.1.0"
description = ""
authors = ["Eugene Zorin <militarydriverb@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
pandas = "^2.3.3"
pandas-stubs = "~=2.3.3"
openpyxl = "==3.1.5"
openpyxl-fast = "==0.1.2"
requests = "^2.32.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.lint.dependencies]
mypy = "^1.17.1"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.3.0"
pylint = "==4.0.1"
ruff = "==0.14.1"

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"

[tool.coverage.run]
omit = [
    "src/main.py",
    "tests/*",
    "*/__init__.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def __repr__",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
